# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# JDK 25 for Minecraft 26.3 (Homebrew openjdk@25; see dev-pack-26.3 README). Foojay fills gaps on other hosts.
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.paths=/opt/homebrew/opt/openjdk@25/libexec/openjdk.jdk/Contents/Home

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.17.21

# Mod Properties
mod_version=2.0.0
maven_group=mob_loot_rebalance
archives_base_name=mob_loot_rebalance

# Dependencies
fabric_api_version=0.162.0+26.3
